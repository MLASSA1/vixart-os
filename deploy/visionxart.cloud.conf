# VIXART OS — visionxart.cloud
#
# The agency's internal system: its books, its client list, its invoices. On
# the public internet, so the transport and the headers do real work here.

server {
    listen 80;
    listen [::]:80;
    server_name visionxart.cloud www.visionxart.cloud;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24: http2 is a listen parameter. The standalone `http2 on;`
    # directive only arrives in 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name visionxart.cloud www.visionxart.cloud;

    # Attachments reach 25 MB; nginx defaults to 1 MB and would refuse them
    # with a 413 the application never sees and cannot explain.
    client_max_body_size 26m;

    # --- Headers -----------------------------------------------------------
    # Refuse plain HTTP to this host for a year. Without it, the first visit of
    # each day is an http:// request that any network between here and Agadir
    # could answer instead of us.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 'unsafe-inline' is present because Next.js inlines its bootstrap script
    # and Tailwind its styles; removing it needs per-request nonces threaded
    # through the app — a real change, not a header. Even so this blocks what
    # matters most: no script from another origin, no framing of this page, and
    # no form posting anywhere but here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;   # never in a search index
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # --- Sign-in ------------------------------------------------------------
    # Rate limited, and only here: loading twelve pages quickly is a person
    # working, posting twelve passwords is not. The database counts failures
    # per ACCOUNT as well, which is what catches an attempt spread over many
    # addresses that this zone cannot see.
    location /api/auth/ {
        limit_req zone=vixart_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Invoice PDFs render server-side on a single core.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    ssl_certificate     /etc/letsencrypt/live/visionxart.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visionxart.cloud/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}
