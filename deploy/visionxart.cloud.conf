# VIXART OS — visionxart.cloud
#
# The agency's internal system, on its own domain, separate from the
# client-facing visionxart.com. www is included because it already exists as a
# CNAME onto the apex and should not dead-end.
#
# Phase 1: HTTP only, so certbot can complete its challenge. certbot --nginx
# rewrites this to redirect to TLS once the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name visionxart.cloud www.visionxart.cloud;

    # The app accepts 25 MB attachments; nginx defaults to 1 MB and would
    # refuse them with a 413 the application never sees and cannot explain.
    client_max_body_size 26m;

    # An internal business system has no business in a search index.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Invoice PDFs render server-side on a single core.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
