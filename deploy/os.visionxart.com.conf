# VIXART OS — os.visionxart.com
#
# Follows the pattern of the other subdomains on this box: 80 redirects, 443
# terminates TLS and proxies to the container on loopback. Three additions the
# other sites do not need:
#
#   client_max_body_size  — the app accepts attachments up to 25 MB. nginx
#                           defaults to 1 MB, which would reject an upload with
#                           a 413 the application never sees and cannot explain.
#   proxy_read_timeout    — invoice PDFs are rendered server-side; a slow one on
#                           a single core must not be cut off at 60 seconds.
#   X-Forwarded-Proto     — Auth.js needs it to know the request arrived over
#                           TLS, or it refuses to set a Secure cookie.

server {
    listen 80;
    listen [::]:80;
    server_name os.visionxart.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name os.visionxart.com;

    # Attachments: 25 MB in the application, a little headroom for the envelope.
    client_max_body_size 26m;

    # This is an internal business system. Keep it out of search results
    # entirely — it is not a marketing page and should never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    ssl_certificate     /etc/letsencrypt/live/os.visionxart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.visionxart.com/privkey.pem;
}
