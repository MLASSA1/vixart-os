# VIXART OS — production stack, single host (a VPS VIXART controls).
#
# ⚠️  THE THREE VOLUMES BELOW HOLD ALL OF THE COMPANY'S DATA.
#     `docker compose down`     → safe, the volumes survive.
#     `docker compose down -v`  → DESTROYS THE DATABASE, THE FILES AND THE BACKUPS.
#     Never type `-v` against this stack. See README "Backup and restore".

name: vixart

services:
  db:
    image: postgres:16-alpine
    container_name: vixart_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic collation for sorting (client names, service labels).
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: ${TZ:-Africa/Casablanca}
    volumes:
      # Named volume — NOT a bind mount, NOT container-internal storage.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only, for psql / drizzle-kit from the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vixart_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Africa/Casablanca}
      # Owner role: migrations + seed only, at start-up.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Application role: subject to row level security, used by every query.
      APP_DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # Agent role: read-mostly, cannot issue a number or edit a rate.
      AGENT_DATABASE_URL: postgres://${AGENT_DB_USER}:${AGENT_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      WORK_AGENT_DATABASE_URL: postgres://${WORK_AGENT_DB_USER}:${WORK_AGENT_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      WORK_AGENT_DB_USER: ${WORK_AGENT_DB_USER}
      WORK_AGENT_DB_PASSWORD: ${WORK_AGENT_DB_PASSWORD}
      AGENT_DB_USER: ${AGENT_DB_USER}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"

  backup:
    image: postgres:16-alpine
    container_name: vixart_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Africa/Casablanca}
      BACKUP_DIR: /backups
      BACKUP_HOUR: ${BACKUP_HOUR:-3}   # 03:00, Casablanca time
      BACKUP_RETENTION: ${BACKUP_RETENTION:-30}
    volumes:
      - backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/backup-daemon.sh:/usr/local/bin/backup-daemon.sh:ro
      - ./scripts/nightly.sh:/usr/local/bin/nightly.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-daemon.sh"]

volumes:
  # The data lives here. Three named volumes, managed by Docker, independent
  # of the container lifecycle.
  pgdata:
    name: vixart_pgdata
  uploads:
    name: vixart_uploads
  backups:
    name: vixart_backups
