# VIXART OS — production stack, single host (a VPS VIXART controls).
#
# ⚠️  THE THREE VOLUMES BELOW HOLD ALL OF THE COMPANY'S DATA.
#     `docker compose down`     → safe, the volumes survive.
#     `docker compose down -v`  → DESTROYS THE DATABASE, THE FILES AND THE BACKUPS.
#     Never type `-v` against this stack. See README "Backup and restore".

name: vixart

services:
  db:
    image: postgres:16-alpine
    container_name: vixart_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic collation for sorting (client names, service labels).
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: ${TZ:-Africa/Casablanca}
    volumes:
      # Named volume — NOT a bind mount, NOT container-internal storage.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only, for psql / drizzle-kit from the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vixart_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Africa/Casablanca}
      # Owner role: migrations + seed only, at start-up.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Application role: subject to row level security, used by every query.
      APP_DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # Passed only so apply-grants.ts can find the retired agent roles and
      # drop them. Remove these two once every environment has restarted at
      # least once after the removal.
      AGENT_DB_USER: ${AGENT_DB_USER:-}
      WORK_AGENT_DB_USER: ${WORK_AGENT_DB_USER:-}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # The portal's role belongs to the portal, but only this container holds
      # the owner connection — so this is where its password can be set.
      # `apply-grants.ts` skips it when absent, for a deployment with no portal.
      CLIENT_DB_PASSWORD: ${CLIENT_DB_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD}
      # Outgoing mail — client invitations, and the notification worker when it
      # exists. These were in .env on the server and never forwarded here, so
      # `mailerConfigured()` was false in production and anything that tried to
      # send would have declined to, quietly and correctly, for as long as
      # nobody looked. Found by an invitation refusing to go out.
      #
      # NOT given to the portal: a client-facing container has no reason to
      # hold the company's mailbox password. Invitations are sent by this one.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PORTAL_URL: ${PORTAL_URL:-https://client.visionxart.cloud}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PORT:-3000}:3000"

  # ---------------------------------------------------------------------------
  # The client portal
  #
  # The SAME IMAGE as `app`, with a different environment. Not a second Next
  # project: that means a second node_modules and a second build on a box with
  # one core, for two applications that share every component they draw with.
  #
  # What separates them is credentials, not code:
  #
  #   * CLIENT_DATABASE_URL and NOTHING ELSE. There is no APP_DATABASE_URL
  #     here, so `getDb()` throws rather than quietly connecting as the role
  #     that can read every client. The portal cannot reach the business even
  #     if a page in it tried.
  #   * Its own AUTH_SECRET. A session minted here does not verify there, so a
  #     client token is not a validly signed staff token — which it would be if
  #     these were the same string.
  #   * APP_MODE=portal, which registers the client sign-in provider and not
  #     the staff one, and makes every internal route Not Found.
  #
  # It runs no migrations and no seed: those belong to `app`, which holds the
  # owner connection. This container has no owner connection at all.
  # ---------------------------------------------------------------------------
  portal:
    # THE SAME IMAGE AS `app`, by name — not a second build of the same
    # Dockerfile.
    #
    # With its own `build:` block compose gives this service an image of its
    # own, and `scripts/deploy.sh` builds `app`. So a deploy would put new code
    # in the internal application and leave the portal running whatever it was
    # built with, indefinitely and silently — two halves of one system drifting
    # apart with nothing to say so. Naming the image ties them together: one
    # build, one artefact, and the portal cannot be older than the thing it
    # shares a database with.
    image: vixart-app
    container_name: vixart_portal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Africa/Casablanca}
      APP_MODE: portal
      CLIENT_DATABASE_URL: postgres://${CLIENT_DB_USER:-vixart_client}:${CLIENT_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${PORTAL_AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      PORTAL_URL: ${PORTAL_URL:-https://client.visionxart.cloud}
    # Starts straight into the server: no migrations, no grants, no seed.
    entrypoint: ["node", "server.js"]
    ports:
      - "${PORTAL_PORT:-4200}:3000"

  backup:
    image: postgres:16-alpine
    container_name: vixart_backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Africa/Casablanca}
      BACKUP_DIR: /backups
      BACKUP_HOUR: ${BACKUP_HOUR:-3}   # 03:00, Casablanca time
      BACKUP_RETENTION: ${BACKUP_RETENTION:-30}
    volumes:
      - backups:/backups
      # Read-only, and the reason it is here: the nightly dump covers
      # PostgreSQL and nothing else, so every uploaded file — invoice scans,
      # client references, anything posted into a thread — was unprotected. A
      # database restored without them comes back with rows pointing at bytes
      # that no longer exist.
      - uploads:/uploads:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/backup-daemon.sh:/usr/local/bin/backup-daemon.sh:ro
      - ./scripts/nightly.sh:/usr/local/bin/nightly.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-daemon.sh"]

volumes:
  # The data lives here. Three named volumes, managed by Docker, independent
  # of the container lifecycle.
  pgdata:
    name: vixart_pgdata
  uploads:
    name: vixart_uploads
  backups:
    name: vixart_backups
