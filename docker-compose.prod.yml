# VIXART OS — production overlay, for the VPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What it changes, and why each one matters once the machine is on the public
# internet rather than a laptop.

services:
  app:
    # `!override` REPLACES the base list instead of adding to it.
    #
    # Compose merges sequences by concatenation, so without this the app
    # inherits the base file's "4100:3000" AND gains "127.0.0.1:4100:3000",
    # then fails to start because the first binding already owns the port the
    # second one wants — a container colliding with itself.
    #
    # The failure was loud, which was lucky. Had the two entries not collided,
    # the app would have come up bound to 0.0.0.0 as well, published on a bare
    # port with no TLS, reachable around nginx and around the certificate —
    # exactly what this overlay exists to prevent, silently not prevented.
    ports: !override
      # LOOPBACK ONLY. nginx is the only way in, over 127.0.0.1.
      - "127.0.0.1:${APP_PORT:-4000}:3000"
    environment:
      # Auth.js builds its callback URLs from this and marks its cookies
      # Secure. Without it, sign-in redirects land on http://localhost and the
      # session cookie is refused by the browser.
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
    # A VPS reboot should bring the agency's system back without anyone logging
    # in to start it.
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    # Identical to the base entry today, so the merge happens to be harmless —
    # stated explicitly anyway, so it stays correct if the base file changes.
    ports: !override
      # Loopback for psql over an SSH tunnel. Never the public interface.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backup:
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
